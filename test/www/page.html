<!doctype html>
<html><head><meta charset="utf-8"><title>Hostile stream page (test)</title>
<style>

  #overlay { position:fixed; inset:0; background:rgba(255,0,255,.35); z-index:999999; display:flex; align-items:center; justify-content:center; font-size:40px; color:#fff; }
  #cookie { position:fixed; bottom:0; left:0; right:0; background:#333; color:#fff; padding:20px; z-index:1000000; }
  iframe { width:800px; height:450px; border:0; display:block; margin-top:16px; }
