<!doctype html>
<html><head><meta charset="utf-8"><title>embed</title>
<style>
  html, body { margin:0; height:100%; background:#222; }
  #ad-top { height:60px; background:orange; color:#000; font-size:24px; }
  #pl { position:relative; width:800px; height:390px; background:#000; }
  #pl video { width:100%; height:100%; }
  #pl .bar { position:absolute; left:0; right:0; bottom:0; height:28px; background:rgba(0,128,255,.7); color:#fff; }
  #pl .subs { position:absolute; left:0; right:0; bottom:40px; text-align:center; color:#ff0; font-size:26px; text-shadow:0 0 4px #000; }
</style></head>
<body>
<div id="ad-top">IFRAME TOP AD</div>
<div id="pl">
  <video id="v2" src="/test.mp4" muted loop playsinline></video>
  <div class="subs">[player subtitle layer]</div>
  <div class="bar">embedded player controls</div>
</div>
<script>
  // start playing a bit after the main page video, so re-targeting to the bigger video is exercised
  setTimeout(() => document.getElementById('v2').play().catch(()=>{}), 1500);
  window.open('/popup.html?from-iframe', '_blank');
</script>
</body></html>
