<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>VideoOnly Browser</title>
<style>
  :root {
    --bg: #15171c; --bg2: #1e2128; --fg: #e8e9ec; --muted: #8b90a0; --border: #2b2f39;
    --accent: #3d8bfd; --accent-fg: #fff; --danger: #e5534b; --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; overflow: hidden; }
  #bar { height: 48px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-bottom: 1px solid var(--border); }
  button { appearance: none; border: 0; background: transparent; color: var(--fg); height: 32px; min-width: 32px;
    padding: 0 8px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font: inherit; }
  button:hover { background: var(--bg2); }
  button:disabled { opacity: .35; cursor: default; }
  button:disabled:hover { background: transparent; }
  button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #url { flex: 1; min-width: 120px; height: 32px; border: 1px solid var(--border); background: #0f1115; color: var(--fg);
    border-radius: 8px; padding: 0 12px; font: inherit; font-size: 13.5px; outline: none; user-select: text; }
  #url:focus { border-color: var(--accent); }
  #url::placeholder { color: var(--muted); }
  .split { display: inline-flex; border-radius: 6px; }
  .split > button:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .split > button:last-child { border-top-left-radius: 0; border-bottom-left-radius: 0; min-width: 20px; padding: 0 4px; }
  #vo.active { background: var(--accent); color: var(--accent-fg); }
  #vo.active + button { background: var(--accent); color: var(--accent-fg); }
  #shield { color: var(--muted); }
  #shield.hot { color: var(--fg); }
  #shield .n { font-variant-numeric: tabular-nums; }
  #notice { display: none; align-items: center; gap: 8px; max-width: 46%; height: 32px; padding: 0 6px 0 10px;
    border-radius: 8px; background: var(--bg2); border: 1px solid var(--border); white-space: nowrap; overflow: hidden; }
  #notice.show { display: inline-flex; }
  #notice .t { overflow: hidden; text-overflow: ellipsis; }
  #notice .t b { font-weight: 600; }
  #notice.popup .t b, #notice.redirect .t b, #notice.download .t b { color: #ff8f88; }
  #notice.info .t b { color: #ffd166; }
  #notice.ok .t b { color: var(--ok); }
  #notice button { height: 24px; min-width: 0; padding: 0 8px; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
  #notice button.x { background: transparent; color: var(--muted); padding: 0 4px; }
  #notice button.x:hover { color: var(--fg); }
  #spin { display: none; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; }
  .loading #spin { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .kbd { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<div id="bar">
  <button id="back" title="Back (Alt+←)" disabled><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button id="fwd" title="Forward (Alt+→)" disabled><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  <button id="reload" title="Reload (Ctrl+R)"><svg id="reload-icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg><svg id="stop-icon" viewBox="0 0 24 24" style="display:none"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="Type a URL or search — Ctrl+L">
  <span id="spin" title="Loading…"></span>
  <div id="notice"><span class="t"></span><button id="notice-open">Open</button><button class="x" id="notice-x" title="Dismiss">✕</button></div>
  <span class="split">
    <button id="vo" title="Show only the video (Ctrl+Shift+V). Esc to exit."><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg><span>Video only</span></button>
    <button id="vo-menu" title="Video-only mode"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  </span>
  <button id="shield" title="Nothing blocked yet"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg><span class="n">0</span></button>
  <button id="settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const urlEl = $('url'), backEl = $('back'), fwdEl = $('fwd'), reloadEl = $('reload'), voEl = $('vo'),
        shieldEl = $('shield'), noticeEl = $('notice'), noticeText = noticeEl.querySelector('.t'),
        noticeOpen = $('notice-open');
  let state = { url: '', loading: false, notice: null };
  let editing = false;

  function render(s) {
    state = s;
    if (!editing) urlEl.value = s.url || '';
    backEl.disabled = !s.canGoBack;
    fwdEl.disabled = !s.canGoForward;
    document.body.classList.toggle('loading', !!s.loading);
    $('reload-icon').style.display = s.loading ? 'none' : '';
    $('stop-icon').style.display = s.loading ? '' : 'none';
    reloadEl.title = s.loading ? 'Stop (Esc)' : 'Reload (Ctrl+R)';
    voEl.classList.toggle('active', !!s.voActive);
    voEl.title = (s.voActive ? 'Exit video-only (Esc)' : 'Show only the video (Ctrl+Shift+V)') +
      ' — mode: ' + (s.voMode === 'video' ? 'bare video' : 'player') + (s.autoVideo ? ' · auto on' : ' · auto off');
    const c = s.counts || {};
    const total = (c.popups || 0) + (c.redirects || 0) + (c.downloads || 0);
    shieldEl.querySelector('.n').textContent = total + (c.ads ? ' · ' + c.ads : '');
    shieldEl.classList.toggle('hot', total > 0);
    shieldEl.title = total || c.ads
      ? `Blocked on this page: ${c.popups || 0} popups, ${c.redirects || 0} redirects, ${c.downloads || 0} downloads` +
        (s.adblock ? `, ${c.ads || 0} ad/tracker requests` : '') + '\nClick for details'
      : 'Nothing blocked yet' + (s.adblockStatus === 'lists-unavailable' ? '\nAd-block lists could not be downloaded' : '');
    const n = s.notice;
    if (n) {
      noticeEl.className = 'show ' + (n.kind || 'info');
      noticeText.innerHTML = '';
      const b = document.createElement('b');
      b.textContent = n.label || '';
      noticeText.appendChild(b);
      noticeText.appendChild(document.createTextNode(n.text ? ' ' + n.text : ''));
      noticeEl.title = n.url || n.text || '';
      noticeOpen.style.display = n.url ? '' : 'none';
      noticeOpen.textContent = n.openLabel || 'Open';
    } else {
      noticeEl.className = '';
    }
  }

  urlEl.addEventListener('focus', () => { editing = true; setTimeout(() => urlEl.select(), 0); });
  urlEl.addEventListener('blur', () => { editing = false; urlEl.value = state.url || ''; });
  urlEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { const v = urlEl.value; urlEl.blur(); vo.navigate(v); }
    else if (e.key === 'Escape') { urlEl.value = state.url || ''; urlEl.blur(); vo.focusContent(); }
  });
  backEl.addEventListener('click', () => vo.back());
  fwdEl.addEventListener('click', () => vo.forward());
  reloadEl.addEventListener('click', () => (state.loading ? vo.stop() : vo.reload()));
  voEl.addEventListener('click', () => vo.toggleVideoOnly());
  $('vo-menu').addEventListener('click', () => vo.videoOnlyMenu());
  shieldEl.addEventListener('click', () => vo.blockedMenu());
  $('settings').addEventListener('click', () => vo.settingsMenu());
  noticeOpen.addEventListener('click', () => { if (state.notice && state.notice.url) vo.openBlocked(state.notice.url); });
  $('notice-x').addEventListener('click', () => vo.dismissNotice());

  // macOS: show ⌘ instead of Ctrl, and ⌘[ / ⌘] for back/forward
  if (vo.platform === 'darwin') {
    const mac = (s) => s.replace(/Alt\+←/g, '⌘[').replace(/Alt\+→/g, '⌘]').replace(/Ctrl\+Shift\+/g, '⇧⌘').replace(/Ctrl\+/g, '⌘');
    for (const el of document.querySelectorAll('[title]')) el.title = mac(el.title);
    urlEl.placeholder = mac(urlEl.placeholder);
    const origRender = render;
    render = (s) => { origRender(s); voEl.title = mac(voEl.title); reloadEl.title = mac(reloadEl.title); };
  }

  vo.onState((s) => render(s));
  vo.onFocusUrl(() => { urlEl.focus(); urlEl.select(); });
  vo.ready();
})();
</script>
</body>
</html>
